name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release and draft GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Parse tag
        id: parse-tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid version tag: $TAG (expected v<numeric versionName>, e.g. v1.0.20260315)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`$TAG\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Name | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache Go toolchain tarball
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/golang
          key: golang-${{ runner.os }}-${{ hashFiles('tunnel/tools/libwg-go/Makefile') }}

      # The :ui release signingConfig reads this material from the environment (see ui/build.gradle.kts).
      # A shippable release MUST be signed — fail loudly if the keystore secret is missing rather than
      # publishing an unsigned artifact.
      - name: Verify signing secret is present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; a release build MUST be signed"
            exit 1
          fi

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.parse-tag.outputs.version }}
        run: ./gradlew :ui:assembleRelease :ui:bundleRelease -PwireguardVersionName="$VERSION"

      - name: Collect release assets
        env:
          TAG: ${{ steps.parse-tag.outputs.tag }}
        run: |
          mkdir -p release-assets
          apk=$(ls ui/build/outputs/apk/release/*.apk | head -n1)
          aab=$(ls ui/build/outputs/bundle/release/*.aab | head -n1)
          case "$apk" in
            *-unsigned.apk)
              echo "::error::Release APK is unsigned ($apk); signing did not apply"
              exit 1
              ;;
          esac
          cp "$apk" "release-assets/wireguard-android-${TAG}.apk"
          cp "$aab" "release-assets/wireguard-android-${TAG}.aab"
          echo "### Release Assets" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh release-assets/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.parse-tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            release-assets/wireguard-android-${TAG}.apk \
            release-assets/wireguard-android-${TAG}.aab
