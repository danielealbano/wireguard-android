name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The three jobs below are independent — none consumes another's artifacts; each checks out fresh,
# provisions the NDK/CMake, and runs its own Gradle tasks. They run in PARALLEL on separate runners
# instead of a needs: chain, cutting wall-clock to the longest single job. Do NOT add needs: unless a
# real artifact dependency is introduced. The Go toolchain that builds libwg-go is downloaded and
# pinned by tunnel/tools/libwg-go/Makefile (GO_VERSION), so no setup-go step is required — only the
# NDK + CMake that Gradle's externalNativeBuild drives.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache Go toolchain tarball
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/golang
          key: golang-${{ runner.os }}-${{ hashFiles('tunnel/tools/libwg-go/Makefile') }}

      - name: Android Lint
        run: ./gradlew :ui:lintDebug :tunnel:lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache Go toolchain tarball
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/golang
          key: golang-${{ runner.os }}-${{ hashFiles('tunnel/tools/libwg-go/Makefile') }}

      - name: Run :tunnel unit tests
        run: ./gradlew :tunnel:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tunnel-test-results
          path: tunnel/build/reports/tests/
          retention-days: 14

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache Go toolchain tarball
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/golang
          key: golang-${{ runner.os }}-${{ hashFiles('tunnel/tools/libwg-go/Makefile') }}

      - name: Assemble debug (all ABIs, native included)
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ui-debug-apk
          path: ui/build/outputs/apk/debug/*.apk
          retention-days: 30
