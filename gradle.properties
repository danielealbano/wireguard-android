wireguardVersionCode=520
wireguardVersionName=1.3.0
# Code namespace (R/BuildConfig, :tunnel Maven groupId) — kept as upstream so no source packages move.
wireguardPackageName=com.wireguard.android
# Installed applicationId for this fork — MUST differ from the official app so both can coexist and
# this build has its own Play listing. The native data-dir/socket path (ANDROID_PACKAGE_NAME) follows it.
wireguardApplicationId=com.danielealbano.wireguard.ws

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false
